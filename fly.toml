# fly.toml app configuration file generated for todo-devops-kngdmn34 on 2026-10-14T23:17:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'todo-devops-kngdmn34'
primary_region = 'cdg'

[build]
  dockerfile="Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"
