name: CI

on: 

  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: Setup node24
          uses: actions/setup-node@v4
          with: 
            node-version: 24
            cache: npm
        - name: clean install
          run: npm ci
        - name: test before build
          run: npm run lint
        - name: run build
          run: npm run build
          env:
            NEXT_TELEMETRY_DISABLED: 1
