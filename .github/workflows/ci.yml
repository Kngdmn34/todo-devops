name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
  build:
     name: lint and build
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v4
       - name: setup-node
         uses: actions/setup-node@v4
         with:
            node-version: 24
            cache: npm

       - name: install
         run: npm ci
       - name: npm audit
         run: npm audit --audit-level=high --omit=dev
       - name: lint
         run: npm run lint
       - name: build
         run: npm run build
         env: 
           NEXT_TELEMETRY_DISABLED: 1
  test:
      name: Unit tests
      runs-on: ubuntu-latest
      services:
          mongo:
            image: mongo:7
            ports: 
              -  27017:27017
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup-node
          uses: actions/setup-node@v4
          with: 
             node-version: 24
             cache: npm
        - name: install
          run: npm ci
        - name: test:unit
          run: npm run test:unit          
          env: 
             MONGODB_URI: mongodb://localhost:27017/todo-devops-test
  docker: 
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build,test]
    steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup buildx
          uses: docker/setup-buildx-action@v3
        - name: build
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: todo-devops:ci
            cache-from: type=gha
            cache-to: type=gha,mode=max
  deploy:
    name: deploy to fly.io
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
    
