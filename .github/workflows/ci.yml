name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
    group: ${{github.workflow}} - ${{github.ref}}
    cancel-in-progress: true

jobs:
  build:
     name: lint and build
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v4
       - name: setup-node
         uses: actions/setup-node@v4
         with:
            node-version: 24
            cache: npm

       - name: install
         run: npm ci
       - name: lint
         run: npm run lint
       - name: build
         run: npm run build
         env: 
           NEXT_TELEMETRY_DISABLED: 1

